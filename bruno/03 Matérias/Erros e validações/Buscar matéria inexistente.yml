info:
  name: Buscar matéria inexistente
  type: http
  seq: 20
  tags:
    - atividade-04

http:
  method: GET
  url: "{{baseUrl}}/subjects/999999"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Informa matéria não encontrada", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
