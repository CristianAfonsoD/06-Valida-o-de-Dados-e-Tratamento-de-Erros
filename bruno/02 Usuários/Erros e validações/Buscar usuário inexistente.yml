info:
  name: Buscar usuário inexistente
  type: http
  seq: 17
  tags:
    - aula-04

http:
  method: GET
  url: "{{baseUrl}}/users/999999"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Informa usuário não encontrado", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
