info:
  name: Criar questão com autor inexistente
  type: http
  seq: 22
  tags:
    - atividade-04

http:
  method: POST
  url: "{{baseUrl}}/questions"
  body:
    type: json
    data: |-
      {
        "enunciado": "Questão inválida",
        "dificuldade": 1,
        "subjectId": {{missingAuthorSubjectId}},
        "authorId": 999999
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const userResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Professor para autor inexistente",
            email: `professor-autor-inexistente-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (userResponse.status !== 201) {
          throw new Error("Não foi possível criar o professor para o autor inexistente");
        }

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria para autor inexistente",
            professorId: userResponse.data.data.id
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria para o autor inexistente");
        }

        bru.setVar("missingAuthorProfessorId", String(userResponse.data.data.id));
        bru.setVar("missingAuthorSubjectId", String(subjectResponse.data.data.id));
    - type: after-response
      code: |-
        const subjectId = bru.getVar("missingAuthorSubjectId");
        const professorId = bru.getVar("missingAuthorProfessorId");

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/subjects/${subjectId}`
          });
        }

        if (professorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/users/${professorId}`
          });
        }
    - type: tests
      code: |-
        test("Informa autor não encontrado ao criar questão", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/questions");
        });

settings:
  encodeUrl: true
