info:
  name: Criar questão com campo extra
  type: http
  seq: 59
  tags:
    - aula-06

http:
  method: POST
  url: "{{baseUrl}}/questions"
  body:
    type: json
    data: |-
      {
        "enunciado": "Questão válida",
        "dificuldade": 2,
        "subjectId": 1,
        "authorId": 1,
        "campoExtra": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejeita campos extras na criação de questão", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("VALIDATION_ERROR");
          expect(res.body.error.details).to.be.an("array");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/questions");
        });

settings:
  encodeUrl: true
