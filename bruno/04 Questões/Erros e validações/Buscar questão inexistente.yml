info:
  name: Buscar questão inexistente
  type: http
  seq: 24
  tags:
    - atividade-04

http:
  method: GET
  url: "{{baseUrl}}/questions/999999"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Informa questão não encontrada", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.be.a("string");
        });

settings:
  encodeUrl: true
