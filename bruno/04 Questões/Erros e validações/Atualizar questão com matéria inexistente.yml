info:
  name: Atualizar questão com matéria inexistente
  type: http
  seq: 44
  tags:
    - atividade-05

http:
  method: PATCH
  url: "{{baseUrl}}/questions/{{missingSubjectQuestionId}}"
  body:
    type: json
    data: |-
      {
        "subjectId": 999999999
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const authorResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Autor para matéria inexistente",
            email: `autor-atualiza-materia-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (authorResponse.status !== 201) {
          throw new Error("Não foi possível criar o autor para a atualização");
        }

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria para atualização",
            professorId: authorResponse.data.data.id
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria para a atualização");
        }

        const questionResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/questions`,
          headers: { "Content-Type": "application/json" },
          data: {
            enunciado: "Questão para matéria inexistente",
            dificuldade: 1,
            respostaCorreta: "Resposta",
            subjectId: subjectResponse.data.data.id,
            authorId: authorResponse.data.data.id
          }
        });

        if (questionResponse.status !== 201) {
          throw new Error("Não foi possível criar a questão para a atualização");
        }

        bru.setVar("missingSubjectQuestionAuthorId", String(authorResponse.data.data.id));
        bru.setVar("missingSubjectQuestionSubjectId", String(subjectResponse.data.data.id));
        bru.setVar("missingSubjectQuestionId", String(questionResponse.data.data.id));
    - type: after-response
      code: |-
        const questionId = bru.getVar("missingSubjectQuestionId");
        const subjectId = bru.getVar("missingSubjectQuestionSubjectId");
        const authorId = bru.getVar("missingSubjectQuestionAuthorId");

        if (questionId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/questions/${questionId}`
          });
        }

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/subjects/${subjectId}`
          });
        }

        if (authorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/users/${authorId}`
          });
        }
    - type: tests
      code: |-
        test("Exige matéria existente ao atualizar questão", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
        });

settings:
  encodeUrl: true
