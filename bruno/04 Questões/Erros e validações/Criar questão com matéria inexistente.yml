info:
  name: Criar questão com matéria inexistente
  type: http
  seq: 21
  tags:
    - atividade-04

http:
  method: POST
  url: "{{baseUrl}}/questions"
  body:
    type: json
    data: |-
      {
        "enunciado": "Questão inválida",
        "dificuldade": 1,
        "subjectId": 999999,
        "authorId": {{missingSubjectAuthorId}}
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const response = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Autor para matéria inexistente",
            email: `autor-materia-inexistente-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (response.status !== 201) {
          throw new Error("Não foi possível criar o autor para a matéria inexistente");
        }

        bru.setVar("missingSubjectAuthorId", String(response.data.data.id));
    - type: after-response
      code: |-
        const authorId = bru.getVar("missingSubjectAuthorId");

        if (authorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/users/${authorId}`
          });
        }
    - type: tests
      code: |-
        test("Informa matéria não encontrada ao criar questão", function() {
          expect(res.status).to.equal(404);
          expect(res.body.success).to.equal(false);
          expect(res.body.error.code).to.equal("NOT_FOUND");
          expect(res.body.timestamp).to.be.a("string");
          expect(res.body.path).to.equal("/questions");
        });

settings:
  encodeUrl: true
