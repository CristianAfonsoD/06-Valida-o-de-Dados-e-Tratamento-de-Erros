info:
  name: Atualizar questão com dificuldade inválida
  type: http
  seq: 43
  tags:
    - atividade-05

http:
  method: PATCH
  url: "{{baseUrl}}/questions/{{invalidDifficultyQuestionId}}"
  body:
    type: json
    data: |-
      {
        "dificuldade": 4
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const suffix = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const authorResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/users`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Autor para atualização de dificuldade",
            email: `autor-atualiza-dificuldade-${suffix}@exemplo.com`,
            papel: "PROFESSOR"
          }
        });

        if (authorResponse.status !== 201) {
          throw new Error("Não foi possível criar o autor para a atualização");
        }

        const subjectResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/subjects`,
          headers: { "Content-Type": "application/json" },
          data: {
            nome: "Matéria para atualização de dificuldade",
            professorId: authorResponse.data.data.id
          }
        });

        if (subjectResponse.status !== 201) {
          throw new Error("Não foi possível criar a matéria para a atualização");
        }

        const questionResponse = await bru.sendRequest({
          method: "POST",
          url: `${bru.getEnvVar("baseUrl")}/questions`,
          headers: { "Content-Type": "application/json" },
          data: {
            enunciado: "Questão para atualização de dificuldade",
            dificuldade: 1,
            respostaCorreta: "Resposta",
            subjectId: subjectResponse.data.data.id,
            authorId: authorResponse.data.data.id
          }
        });

        if (questionResponse.status !== 201) {
          throw new Error("Não foi possível criar a questão para a atualização");
        }

        bru.setVar("invalidDifficultyQuestionAuthorId", String(authorResponse.data.data.id));
        bru.setVar("invalidDifficultyQuestionSubjectId", String(subjectResponse.data.data.id));
        bru.setVar("invalidDifficultyQuestionId", String(questionResponse.data.data.id));
    - type: after-response
      code: |-
        const questionId = bru.getVar("invalidDifficultyQuestionId");
        const subjectId = bru.getVar("invalidDifficultyQuestionSubjectId");
        const authorId = bru.getVar("invalidDifficultyQuestionAuthorId");

        if (questionId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/questions/${questionId}`
          });
        }

        if (subjectId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/subjects/${subjectId}`
          });
        }

        if (authorId) {
          await bru.sendRequest({
            method: "DELETE",
            url: `${bru.getEnvVar("baseUrl")}/users/${authorId}`
          });
        }
    - type: tests
      code: |-
        test("Rejeita dificuldade fora do intervalo permitido", function() {
          expect(res.status).to.equal(400);
          expect(res.body.success).to.equal(false);
        });

settings:
  encodeUrl: true
